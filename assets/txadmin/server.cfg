# This server was set up by the vMenu Enhanced txAdmin recipe (vMenu Enhanced v__VMENU_VERSION__).
# Please read the FiveM documentation:
#   https://aka.cfx.re/server-commands
#   https://docs.fivem.net/docs/server-manual/setting-up-a-server/
# And the vMenu Enhanced documentation:
#   https://docs.vespura.com/vmenu/enhanced

## You SHOULD edit the following:
sv_hostname "{{serverName}} built with {{recipeName}}!"
sets sv_projectName "[{{recipeName}}] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "enhanced, default, deployer, vMenu-Enhanced"
sets locale "root-AQ"

## You CAN edit the following:
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
{{serverEndpoints}}

## These resources will start by default.
ensure mapmanager
ensure spawnmanager
ensure basic-gamemode

## Add system admins
## Everybody in group.admin also gets every vMenu permission, see vMenu.Enhanced/config/permissions.cfg.
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
{{addPrincipalsMaster}}

## vMenu plugins
## Plugins live in resources/[vmenu-plugins]/. They do not have permission or settings files yet,
## because vMenu writes those the first time it sees a plugin running. To set them up:
##   1. Start your server once, with vMenu.Enhanced and the plugins running.
##   2. Open resources/vMenu.Enhanced/config/plugins/. For every plugin you will find two files there,
##      for example vMenu.RoutingBucketsPlugin.permissions.cfg.example and
##      vMenu.RoutingBucketsPlugin.configuration.cfg.example.
##   3. Copy each of them, and remove .example from the name of the copy.
##   4. Edit the copies to your liking.
##   5. Remove the # in front of the matching exec lines below, and restart your server.
## Until then, everybody in group.admin can already use every plugin.
# exec @vMenu.Enhanced/config/plugins/vMenu.RoutingBucketsPlugin.permissions.cfg
# exec @vMenu.Enhanced/config/plugins/vMenu.RoutingBucketsPlugin.configuration.cfg

## vMenu Enhanced
## permissions.cfg decides who may use what, configuration.cfg holds every vMenu setting.
## Both files are yours to edit, vMenu never changes them. Keep these lines above "ensure vMenu.Enhanced".
exec @vMenu.Enhanced/config/permissions.cfg
exec @vMenu.Enhanced/config/configuration.cfg

## vMenu and the routing buckets plugin save files inside their own folders, which needs these.
add_filesystem_permission vMenu.Enhanced write vMenu.Enhanced
add_filesystem_permission vMenu.RoutingBucketsPlugin write vMenu.RoutingBucketsPlugin

ensure vMenu.Enhanced
ensure [vmenu-plugins]
