<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>vMenu Enhanced</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="input.css">
    <link rel="stylesheet" href="transfer.css">
    <link rel="stylesheet" href="notifications.css">
    <link rel="stylesheet" href="staff-alerts.css">
    <link rel="stylesheet" href="ticks.css">
    <link rel="stylesheet" href="speedometer.css">
</head>

<body>
    <div id="speedometer"></div>

    <div id="scrim">
        <div id="panel">
            <div id="title"></div>
            <div id="field"><input id="input" type="text" autocomplete="off" spellcheck="false"></div>
            <ul id="suggestions"></ul>
            <div id="footer"></div>
        </div>
    </div>

    <div id="transfer"></div>

    <!-- After the prompt and the transfer panel, so a notification is never buried under a scrim. -->
    <div id="toasts"></div>

    <!-- Somebody asking for help outranks a notification, so it sits over the top of one. -->
    <div id="staff-alerts"></div>

    <!-- Last, so the debugging overlay stays readable over both the prompt and the notifications. -->
    <div id="ticks"></div>

    <script src="input.js"></script>
    <script src="transfer.js"></script>
    <script src="notifications.js"></script>
    <script src="staff-alerts.js"></script>
    <script src="ticks.js"></script>
    <script src="speedometer.js"></script>
</body>

</html>
