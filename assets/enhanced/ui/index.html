<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>vMenu Enhanced</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="input.css">
    <link rel="stylesheet" href="notifications.css">
    <link rel="stylesheet" href="ticks.css">
</head>

<body>
    <div id="scrim">
        <div id="panel">
            <div id="title"></div>
            <div id="field"><input id="input" type="text" autocomplete="off" spellcheck="false"></div>
            <ul id="suggestions"></ul>
            <div id="footer"></div>
        </div>
    </div>

    <!-- After the prompt, so a notification is never buried under the scrim. -->
    <div id="toasts"></div>

    <!-- Last, so the debugging overlay stays readable over both the prompt and the notifications. -->
    <div id="ticks"></div>

    <script src="input.js"></script>
    <script src="notifications.js"></script>
    <script src="ticks.js"></script>
</body>

</html>
