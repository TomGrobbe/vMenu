<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>vMenu Enhanced</title>
    <link rel="stylesheet" href="shared.css">

    <link rel="stylesheet" href="menuapi/colour-list.min.css">
    <link rel="stylesheet" href="menuapi/menuapi.min.css">
    <link rel="stylesheet" href="input.css">
    <link rel="stylesheet" href="transfer.css">
    <link rel="stylesheet" href="notifications.css">
    <link rel="stylesheet" href="staff-alerts.css">
    <link rel="stylesheet" href="ticks.css">
    <link rel="stylesheet" href="speedometer.css">
    <link rel="stylesheet" href="forecast.css">
    <link rel="stylesheet" href="location.css">
</head>

<body>
    
    <div id="menuapi"></div>

    <div id="speedometer"></div>

    <div id="coordinates"></div>

    <div id="scrim">
        <div id="panel">
            <div id="title"></div>
            <div id="prompt-description"></div>
            <div id="field"><input id="input" type="text" autocomplete="off" spellcheck="false"></div>
            <ul id="suggestions"></ul>
            <div id="footer"></div>
        </div>
    </div>

    <div id="transfer"></div>

    <div id="hud-left">
        <div id="toasts"></div>

        <div id="hud-info">
            <div id="forecast-compact"></div>
            <div id="forecast-clock"></div>
            <div id="location"></div>
        </div>
    </div>

    <div id="hud-top">
        <div id="staff-alerts"></div>
        <div id="forecast"></div>
    </div>

    <div id="ticks"></div>

    <script src="menuapi/sprite-cache.min.js"></script>
    <script src="menuapi/glare.min.js"></script>
    <script src="menuapi/colour-list.min.js"></script>
    <script src="menuapi/menuapi.min.js"></script>

    <script src="hud.js"></script>
    <script src="input.js"></script>
    <script src="transfer.js"></script>
    <script src="notifications.js"></script>
    <script src="staff-alerts.js"></script>
    <script src="ticks.js"></script>
    <script src="speedometer.js"></script>
    <script src="forecast.js"></script>
    <script src="location.js"></script>
</body>

</html>
