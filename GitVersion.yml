# GitVersion configuration (vMenu legacy)
# Docs: https://gitversion.net/docs/reference/configuration
#
# Every commit on legacy bumps the patch version. Put one of these in a commit message to change that:
#   +semver: major | minor | patch | none

assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch
mode: Mainline

branches:
  # Both names match because GitVersion trusts GITHUB_REF over the branch that is checked out.
  # GitVersion has no defaults for a branch called legacy, without these it labels builds 3.8.62-legacy.1.
  mainline:
    regex: '^(legacy|enhanced)$'
    increment: Patch
    is-mainline: true
    tag: ''
    source-branches: []
