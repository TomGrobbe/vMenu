# GitVersion configuration (vMenu Enhanced)
# Docs: https://gitversion.net/docs/reference/configuration
#
# Every commit on enhanced bumps the patch version. Put one of these in a commit message to change that:
#   +semver: major | minor | patch | none
#
# The enhanced-v prefix keeps this line apart from the legacy v tags that are also in this history.
# Never use next-version here, it acts as a floor and freezes the version once it is reached.

assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch
mode: Mainline
tag-prefix: 'enhanced-v'

branches:
  # Both names match because GitVersion trusts GITHUB_REF over the branch that is checked out.
  # The empty tag drops the pre-release label, otherwise builds come out as 1.0.0-enhanced.1.
  mainline:
    regex: '^(enhanced|legacy)$'
    increment: Patch
    is-mainline: true
    tag: ''
    source-branches: []
