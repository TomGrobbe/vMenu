<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vMenu Docs</title>
  <meta name="description" content="Documentation for vMenu — a server-sided trainer/menu for FiveM." />
  <link rel="icon" type="image/png" href="/vmenu/legacy/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Set the theme before first paint. Shares the `starlight-theme` key with the
       Starlight docs on the same domain, and defaults to dark when unset. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('starlight-theme');
        document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5GXWQVLZ8Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5GXWQVLZ8Z');
  </script>
  <style>
    :root {
      --ink: #1a1523;
      --line: var(--ink);
      --cream: #fef3d9;
      --dot: #f4dfb0;
      --paper: #ffffff;
      --violet: #b79bff;
      --mint: #7fe0c8;
      --muted: #cdc6bb;
      /* text/icons sitting on an accent fill stay dark in both themes */
      --on-accent: #1a1523;
    }

    /* Dark land: flip ink (text) to a soft off-white, cream (page) to charcoal,
       soften the outlines to a muted grey, and use the docs' blue accent. */
    :root[data-theme='dark'] {
      --ink: #e4e1d8;
      --line: #4c515a;
      --cream: #1e2025;
      --dot: #2a2e36;
      --paper: #262930;
      --violet: #6f8fc9;
      --mint: #5bbfa8;
      --muted: #8b8577;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka', system-ui, sans-serif;
      background-color: var(--cream);
      background-image: radial-gradient(var(--dot) 2.5px, transparent 2.5px);
      background-size: 30px 30px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .head {
      text-align: center;
      margin-bottom: 2.4rem;
      animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .head .logo {
      width: 84px;
      height: 84px;
      border: 4px solid var(--line);
      border-radius: 22px;
      background: var(--violet);
      box-shadow: 6px 6px 0 var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .head .logo svg { width: 42px; height: 42px; stroke: var(--on-accent); }
    .head h1 { font-size: 2.6rem; font-weight: 700; line-height: 1; }
    .head p { font-size: 1.1rem; font-weight: 500; opacity: 0.7; margin-top: 0.4rem; }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      align-items: stretch;
      width: 100%;
      max-width: 720px;
    }

    .card {
      position: relative;
      flex: 1 1 260px;
      max-width: 320px;
      text-decoration: none;
      color: var(--ink);
      background: var(--paper);
      border: 4px solid var(--line);
      border-radius: 26px;
      padding: 2.4rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 8px 8px 0 var(--line);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease, color 0.2s ease;
      animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .card.legacy  { animation-delay: 0.05s; }
    .card.enhanced { animation-delay: 0.15s; }
    .card:hover { color: var(--on-accent); }

    .card.legacy:hover {
      transform: translate(-2px, -4px);
      box-shadow: 12px 14px 0 var(--line);
      background: var(--violet);
    }
    .card.legacy:active {
      transform: translate(6px, 6px);
      box-shadow: 2px 2px 0 var(--line);
    }

    .card.enhanced:hover {
      transform: translate(-2px, -4px);
      box-shadow: 12px 14px 0 var(--line);
      background: var(--mint);
    }
    .card.enhanced:active {
      transform: translate(6px, 6px);
      box-shadow: 2px 2px 0 var(--line);
    }

    .blob {
      width: 96px;
      height: 96px;
      border: 4px solid var(--line);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.4rem;
      transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
    }
    .card.legacy .blob   { background: var(--violet); box-shadow: 4px 4px 0 var(--line); }
    .card.enhanced .blob { background: var(--mint); box-shadow: 4px 4px 0 var(--line); }
    .card:hover .blob { transform: rotate(-8deg) scale(1.05); }
    .blob svg { width: 46px; height: 46px; stroke: var(--on-accent); }

    .name { font-size: 1.7rem; font-weight: 700; line-height: 1; margin-bottom: 0.4rem; }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 1.05rem;
      font-weight: 600;
      opacity: 0.7;
    }
    .card:hover .tag { opacity: 1; }
    .tag svg { transition: transform 0.2s ease; }
    .card:hover .tag svg { transform: translateX(4px); }

    .badge {
      position: absolute;
      top: -14px;
      right: -10px;
      background: var(--mint);
      color: var(--on-accent);
      border: 3px solid var(--line);
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 3px 3px 0 var(--line);
      transform: rotate(6deg);
    }

    .back {
      margin-top: 2.4rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 1rem;
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 999px;
      padding: 0.6rem 1.2rem;
      box-shadow: 4px 4px 0 var(--line);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease, color 0.2s ease;
      animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) both;
      animation-delay: 0.25s;
    }
    .back:hover {
      transform: translate(-2px, -3px);
      box-shadow: 7px 8px 0 var(--line);
      background: var(--mint);
      color: var(--on-accent);
    }
    .back:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--line);
    }
    .back svg { transition: transform 0.2s ease; }
    .back:hover svg { transform: translateX(-3px); }

    /* light/dark toggle, top-right cartoon pill */
    #theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: 999px;
      box-shadow: 3px 3px 0 var(--line);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    #theme-toggle:hover { transform: translate(-1px, -2px); box-shadow: 5px 6px 0 var(--line); }
    #theme-toggle:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
    #theme-toggle svg { width: 20px; height: 20px; }
    #theme-toggle .sun { display: none; }
    :root[data-theme='dark'] #theme-toggle .sun { display: block; }
    :root[data-theme='dark'] #theme-toggle .moon { display: none; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(24px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>

  <div class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a1523" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="13" y2="17"/></svg>
    </div>
    <h1>vMenu</h1>
    <p>Documentation</p>
  </div>

  <main class="cards">
    <a class="card legacy" href="/vmenu/legacy/">
      <div class="blob">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a1523" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div class="name">vMenu for FiveM Legacy</div>
      <span class="tag">
        Browse documentation
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </a>

    <a class="card enhanced" href="/vmenu/enhanced/">
      <div class="blob">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a1523" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <div class="name">vMenu for FiveM Enhanced</div>
      <span class="tag">
        Browse documentation
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </a>
  </main>

  <a class="back" href="/">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to all docs
  </a>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('starlight-theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
