<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5GXWQVLZ8Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5GXWQVLZ8Z');

  <style>
    :root { --ink: #1a1523; --cream: #fef3d9; --dot: #f4dfb0; --mint: #7fe0c8; --violet: #b79bff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Fredoka', system-ui, sans-serif;
      background-color: var(--cream);
      background-image: radial-gradient(var(--dot) 2.5px, transparent 2.5px);
      background-size: 30px 30px;
      color: var(--ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; -webkit-font-smoothing: antialiased;
    }
    .panel {
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 26px;
      box-shadow: 8px 8px 0 var(--ink);
      padding: 3rem 2.6rem;
      max-width: 460px;
      text-align: center;
      animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .blob {
      width: 96px; height: 96px;
      border: 4px solid var(--ink); border-radius: 30px;
      background: var(--mint); box-shadow: 4px 4px 0 var(--ink);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 1.4rem;
    }
    .blob svg { width: 46px; height: 46px; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.6rem; }
    p { font-size: 1.05rem; font-weight: 500; opacity: 0.75; margin-bottom: 1.8rem; line-height: 1.5; }
    .back {
      display: inline-flex; align-items: center; gap: 0.5rem;
      text-decoration: none; color: var(--ink); font-weight: 600;
      background: var(--violet);
      border: 4px solid var(--ink); border-radius: 16px;
      padding: 0.7rem 1.3rem;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .back:hover { transform: translate(-2px, -3px); box-shadow: 8px 9px 0 var(--ink); }
    .back:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
    @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(0.9);} to { opacity: 1; transform: translateY(0) scale(1);} }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="panel">
    <div class="blob">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a1523" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>

      Back to vMenu Legacy Docs
    </a>
  </div>
</body>
</html>
